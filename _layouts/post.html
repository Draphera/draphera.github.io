---
layout: default
---
<article class="section">
  <div class="container manifesto-document">
    <p class="eyebrow">{{ page.category }}</p>
    <h1>{{ page.title }}</h1>
    <p>{{ page.date | date: "%d/%m/%Y" }}</p>
    <div class="surface-card featured-card">
      {{ content }}
    </div>
  </div>
</article>
